<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>פיתוחי חותם | ניהול לידים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--ink:#2F352E;--ink2:#4A4F47;--muted:#7A7768;--cream:#FAF9F5;--sand:#EAE7DD;--line:#DED7C6;--gold:#9A8152;--gold-dk:#7A6540;--white:#fff;--err:#A33A3A;--ok:#3F6B45}
*{box-sizing:border-box}
html{scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans Hebrew',Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--gold);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--gold-dk)}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.wa{background:#2E7D4F}.btn.wa:hover{background:#25663F}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible{outline:3px solid var(--gold-dk);outline-offset:2px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;box-shadow:0 6px 24px rgba(31,29,26,.08)}
.lbox img{height:62px;margin:0 auto 10px;display:block}
.lbox h1{font-size:20px;font-weight:600;margin:0 0 16px}
.lbox input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px;text-align:center;letter-spacing:1px;direction:ltr;margin-bottom:12px;text-transform:uppercase}
.lbox .btn{width:100%}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
/* app */
header.top{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
header.top img{height:44px}
header.top h1{font-size:18px;font-weight:600;margin:0;flex:1}
header.top .upd{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:18px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:center}
.stat b{display:block;font-size:26px;font-weight:600;color:var(--gold-dk);line-height:1.2}
.stat span{font-size:13px;color:var(--ink2)}
.stat[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#F7F3EA}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filters input,.filters select{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--white)}
.count{font-size:14px;color:var(--muted);margin:0 0 8px}
.tbl{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 12px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap}
th[data-k="name"],th[data-k="plan"]{text-align:right}
th .ar{opacity:.6;font-size:11px}
td{padding:10px 12px;border-top:1px solid var(--line);font-size:15px;text-align:center;vertical-align:middle}
td.l{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7F3EA}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sand);white-space:nowrap}
.pill.s-new{background:#E8E0CC;color:#6A5530}.pill.s-check{background:#F3E3C7;color:#7A5418}.pill.s-noans{background:#EDE3E3;color:#7A3B3B}
.pill.s-work{background:#E1E8EF;color:#34506B}.pill.s-meet{background:#DDEBDF;color:#2F5E39}.pill.s-met{background:#D3E6D6;color:#244F2E}
.pill.s-won{background:#2F5E39;color:#fff}.pill.s-lost{background:#ECECEC;color:#666}
.lvl{font-size:13px;color:var(--ink2)}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* mobile cards */
.cards{display:none;gap:10px}
.lc{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:4px}
.lc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lc b{font-size:17px}
.lc .m{font-size:14px;color:var(--ink2)}
/* detail */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(31,29,26,.45)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white)}
.dh h2{margin:0;font-size:22px;font-weight:600}
.dh .sub{font-size:14px;color:var(--muted)}
.x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;color:var(--ink2)}
.db{padding:16px 22px 22px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px;margin-bottom:18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ed label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.ed select,.ed input,.ed textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--white)}
.ed textarea{min-height:110px;resize:vertical}
.saveRow{display:flex;align-items:center;gap:12px;margin-top:14px}
.saved{font-size:14px;color:var(--ok)}
/* sources */
.src td,.src th{text-align:center}
.src td.l{text-align:right}
.note{font-size:14px;color:var(--muted);margin:10px 0 30px}
@media (max-width:820px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.tbl.leads{display:none}.cards{display:grid}.kv{grid-template-columns:100px 1fr}header.top .upd{display:none}}
</style>
</head>

<label for="eNotes">הערות שיחה</label><textarea id="eNotes"></textarea>
<div class="saveRow"><button class="btn" type="button" id="eSave">שמירה</button><span class="saved" id="eMsg" role="status"></span></div>
</div>
</div>
</dialog>

<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbyNUXPd1BSIjdQEL42h5gQDsNkdEEv_D5m2NzTy1FWrrwUiMT7t7I2DOorCZkyt8O8FnA/exec';
var KEY='', DATA=null, SORT={k:'date',dir:-1}, FILTER_STAT='', CUR=null;
var COLS=['date','status','name','phone','city','region','plan','property','permit','budget','when','architect','notes','src','partner','reason','next','talk','id'];
var STCLS={'חדש':'s-new','לבדיקה':'s-check','אין מענה':'s-noans','בטיפול':'s-work','נקבעה פגישה':'s-meet','היה בפגישה':'s-met','נסגר':'s-won','לא רלוונטי':'s-lost'};
var LABELS={region:'אזור',plan:'מה מתכננים',property:'פרטי הנכס',permit:'היתר',budget:'תקציב',when:'מתי מתחילים',architect:'אדריכל',notes:'הערות הלקוח',src:'קוד מקור',partner:'שותף מפנה',reason:'רמת רלוונטיות'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function store(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}}
function load(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function call(p){p.type='crm';p.key=KEY;return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(function(r){return r.json();});}
function level(x){var r=x.reason||'';return /גבוהה/.test(r)?'גבוהה':/בינונית/.test(r)?'בינונית':/נמוכה/.test(r)?'נמוכה':/בדיקה|לא זוהה|לסינון/.test(r)?'לבדיקה':'';}
function srcName(x){if(x.partner)return x.partner;var s=x.src||'';if(!s||s==='direct')return 'כניסה ישירה';if(DATA.codes[s])return DATA.codes[s];if(s==='gag')return 'קמפיין עליות גג';return s;}
function waLink(x){var d=(x.phone||'').replace(/\D/g,'');if(d.indexOf('0')===0)d='972'+d.slice(1);var first=(x.name||'').split(' ')[0];var what=x.plan?(' בנושא '+x.plan):'';var t='שלום '+first+', כאן פיתוחי חותם. קיבלנו את פנייתך'+what+'. מתי יהיה לך נוח לשוחח כמה דקות?';return 'https://wa.me/'+d+'?text='+encodeURIComponent(t);}

function login(code){
  KEY=code.trim().toUpperCase();$('lbtn').disabled=true;$('lerr').textContent='';
  return call({action:'list'}).then(function(r){
    $('lbtn').disabled=false;
    if(!r.ok){$('lerr').textContent=r.error==='locked'?'יותר מדי ניסיונות. אפשר לנסות שוב בעוד 10 דקות.':'קוד שגוי.';store('pc_key',null);return;}
    store('pc_key',KEY);DATA=r;prep();$('login').hidden=true;$('app').hidden=false;render();
  }).catch(function(){$('lbtn').disabled=false;$('lerr').textContent='אין חיבור לשרת. אפשר לנסות שוב.';});
}
function refresh(){
  $('refresh').disabled=true;
  return call({action:'list'}).then(function(r){$('refresh').disabled=false;if(r.ok){DATA=r;prep();render();}}).catch(function(){$('refresh').disabled=false;});
}
function prep(){
  DATA.items=DATA.leads.map(function(l){var o={row:l.row};COLS.forEach(function(c,i){o[c]=l.v[i]||'';});o.level=level(o);o.srcLabel=srcName(o);if(!o.status)o.status='חדש';return o;});
  var now=new Date();$('upd').textContent='עודכן '+now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  var fs=$('fStatus'),cur=fs.value;fs.innerHTML='<option value="">כל הסטטוסים</option>'+DATA.statuses.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');fs.value=cur;
  var ps={};DATA.items.forEach(function(x){if(x.partner)ps[x.partner]=1;});Object.keys(DATA.codes||{}).forEach(function(k){ps[DATA.codes[k]]=1;});
  var fp=$('fPartner');cur=fp.value;fp.innerHTML='<option value="">כל השותפים</option><option value="__none">בלי שותף</option>'+Object.keys(ps).sort().map(function(p){return '<option>'+esc(p)+'</option>';}).join('');fp.value=cur;
  var ss={};DATA.items.forEach(function(x){ss[x.srcLabel]=1;});
  var fsr=$('fSource');cur=fsr.value;fsr.innerHTML='<option value="">כל המקורות</option>'+Object.keys(ss).sort().map(function(p){return '<option>'+esc(p)+'</option>';}).join('');fsr.value=cur;
  $('eStatus').innerHTML=DATA.statuses.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
}
function filtered(){
  var q=$('q').value.trim().toLowerCase(),st=$('fStatus').value||FILTER_STAT,pa=$('fPartner').value,so=$('fSource').value;
  return DATA.items.filter(function(x){
    if(st&&x.status!==st)return false;
    if(pa==='__none'&&x.partner)return false;
    if(pa&&pa!=='__none'&&x.partner!==pa)return false;
    if(so&&x.srcLabel!==so)return false;
    if(q&&(x.name+' '+x.phone.replace(/\D/g,'')+' '+x.city).toLowerCase().indexOf(q.replace(/-/g,''))<0)return false;
    return true;
  }).sort(function(a,b){
    var k=SORT.k,va=k==='partner'?a.srcLabel:a[k],vb=k==='partner'?b.srcLabel:b[k];
    if(k==='status'){va=DATA.statuses.indexOf(a.status);vb=DATA.statuses.indexOf(b.status);}
    if(k==='level'){var o={'גבוהה':0,'בינונית':1,'לבדיקה':2,'נמוכה':3,'':4};va=o[a.level];vb=o[b.level];}
    return (va>vb?1:va<vb?-1:0)*SORT.dir;
  });
}
function render(){
  var it=DATA.items,c=function(s){return it.filter(function(x){return x.status===s;}).length;};
  var met=it.filter(function(x){return ['נקבעה פגישה','היה בפגישה','נסגר'].indexOf(x.status)>=0;}).length;
  var S=[['','כל הלידים',it.length],['חדש','חדשים',c('חדש')],['לבדיקה','לבדיקה',c('לבדיקה')],['אין מענה','אין מענה',c('אין מענה')],['נקבעה פגישה','נקבעה פגישה',c('נקבעה פגישה')],['נסגר','נסגרו',c('נסגר')]];
  $('stats').innerHTML=S.map(function(s){return '<button type="button" class="stat" data-s="'+esc(s[0])+'" aria-pressed="'+(FILTER_STAT===s[0]&&!$('fStatus').value?'true':'false')+'"><b>'+s[2]+'</b><span>'+esc(s[1])+'</span></button>';}).join('');
  var f=filtered();
  $('count').textContent=f.length+' מתוך '+it.length+' לידים · פגישות ומעלה: '+met;
  document.querySelectorAll('th[data-k]').forEach(function(th){var a=th.querySelector('.ar');if(a)a.textContent=th.dataset.k===SORT.k?(SORT.dir>0?'▲':'▼'):'';});
  if(!f.length){$('rows').innerHTML='<tr><td colspan="8" class="empty">אין לידים שמתאימים לסינון.</td></tr>';$('cards').innerHTML='<div class="empty">אין לידים שמתאימים לסינון.</div>';return;}
  $('rows').innerHTML=f.map(function(x){return '<tr tabindex="0" data-row="'+x.row+'"><td>'+esc(x.date.slice(0,10))+'</td><td class="l"><b>'+esc(x.name)+'</b></td><td dir="ltr">'+esc(x.phone)+'</td><td>'+esc(x.city)+'</td><td class="l">'+esc(x.plan)+'</td><td class="lvl">'+esc(x.level)+'</td><td>'+esc(x.srcLabel)+'</td><td><span class="pill '+(STCLS[x.status]||'')+'">'+esc(x.status)+'</span></td></tr>';}).join('');
  $('cards').innerHTML=f.map(function(x){return '<div class="lc" tabindex="0" data-row="'+x.row+'"><div class="h"><b>'+esc(x.name)+'</b><span class="pill '+(STCLS[x.status]||'')+'">'+esc(x.status)+'</span></div><div class="m" dir="ltr" style="text-align:right">'+esc(x.phone)+'</div><div class="m">'+esc([x.city,x.plan].filter(Boolean).join(' · '))+'</div><div class="m">'+esc(x.date.slice(0,10))+' · '+esc(x.srcLabel)+'</div></div>';}).join('');
  renderSources();
}
function renderSources(){
  var agg={};
  Object.keys(DATA.sources||{}).forEach(function(k){var n=k==='direct'?'כניסה ישירה':(DATA.codes[k]||(k==='gag'?'קמפיין עליות גג':k));agg[n]=agg[n]||{visit:0,start:0,lead:0,rows:0,meet:0,won:0};agg[n].visit+=DATA.sources[k].visit;agg[n].start+=DATA.sources[k].start;agg[n].lead+=DATA.sources[k].lead;});
  DATA.items.forEach(function(x){var n=x.srcLabel;agg[n]=agg[n]||{visit:0,start:0,lead:0,rows:0,meet:0,won:0};agg[n].rows++;if(['נקבעה פגישה','היה בפגישה','נסגר'].indexOf(x.status)>=0)agg[n].meet++;if(x.status==='נסגר')agg[n].won++;});
  var keys=Object.keys(agg).sort(function(a,b){return agg[b].rows-agg[a].rows||agg[b].visit-agg[a].visit;});
  $('srcRows').innerHTML=keys.length?keys.map(function(k){var a=agg[k];return '<tr><td class="l"><b>'+esc(k)+'</b></td><td>'+a.visit+'</td><td>'+a.start+'</td><td>'+a.lead+'</td><td>'+a.rows+'</td><td>'+a.meet+'</td><td>'+a.won+'</td></tr>';}).join(''):'<tr><td colspan="7" class="empty">עוד אין נתונים.</td></tr>';
}
function openLead(row){
  var x=DATA.items.filter(function(i){return String(i.row)===String(row);})[0];if(!x)return;CUR=x;
  $('dName').textContent=x.name||'ללא שם';
  $('dSub').textContent=[x.date,x.srcLabel].filter(Boolean).join(' · ');
  var tel=(x.phone||'').replace(/\D/g,'');
  $('dActs').innerHTML=(tel?'<a class="btn" href="tel:'+tel+'">חיוג '+esc(x.phone)+'</a><a class="btn wa" target="_blank" rel="noopener" href="'+waLink(x)+'">וואטסאפ עם הודעה מוכנה</a>':'<span class="note" style="margin:0">אין טלפון. לפנות דרך פייסבוק או אינסטגרם.</span>');
  $('dKv').innerHTML='<dt>יישוב</dt><dd>'+esc(x.city||'לא צוין')+'</dd>'+Object.keys(LABELS).filter(function(k){return x[k]&&k!=='src';}).map(function(k){return '<dt>'+LABELS[k]+'</dt><dd>'+esc(x[k])+'</dd>';}).join('');
  $('eStatus').value=x.status;$('eNext').value=x.next;$('eNotes').value=x.talk;$('eMsg').textContent='';
  $('dlg').showModal();
}
function save(){
  var x=CUR;if(!x)return;var b=$('eSave');b.disabled=true;$('eMsg').textContent='שומר...';
  var p={action:'save',row:x.row,name:x.name,phone:x.phone,status:$('eStatus').value,next:$('eNext').value,notes:$('eNotes').value};
  call(p).then(function(r){
    b.disabled=false;
    if(r.ok){x.status=p.status;x.next=p.next;x.talk=p.notes;$('eMsg').textContent='נשמר';render();}
    else if(r.error==='changed'){$('eMsg').textContent='השורה השתנתה בגיליון. מרעננים, ואז לנסות שוב.';refresh();}
    else $('eMsg').textContent='לא נשמר. אפשר לנסות שוב.';
  }).catch(function(){b.disabled=false;$('eMsg').textContent='אין חיבור לשרת. לא נשמר.';});
}
$('lform').addEventListener('submit',function(e){e.preventDefault();login($('code').value);});
$('refresh').addEventListener('click',refresh);
$('logout').addEventListener('click',function(){store('pc_key',null);location.reload();});
['q','fStatus','fPartner','fSource'].forEach(function(id){$(id).addEventListener('input',function(){if(id==='fStatus')FILTER_STAT='';render();});});
$('stats').addEventListener('click',function(e){var b=e.target.closest('.stat');if(!b)return;FILTER_STAT=b.dataset.s;$('fStatus').value='';render();});
document.querySelector('thead').addEventListener('click',function(e){var th=e.target.closest('th[data-k]');if(!th||th.dataset.k==='phone')return;if(SORT.k===th.dataset.k)SORT.dir*=-1;else{SORT.k=th.dataset.k;SORT.dir=th.dataset.k==='date'?-1:1;}render();});
function rowClick(e){var r=e.target.closest('[data-row]');if(r)openLead(r.dataset.row);}
function rowKey(e){if(e.key==='Enter'){var r=e.target.closest('[data-row]');if(r)openLead(r.dataset.row);}}
['rows','cards'].forEach(function(id){$(id).addEventListener('click',rowClick);$(id).addEventListener('keydown',rowKey);});
$('dClose').addEventListener('click',function(){$('dlg').close();});
$('eSave').addEventListener('click',save);
document.querySelectorAll('.tabs button').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tabs button').forEach(function(o){o.setAttribute('aria-selected',o===t?'true':'false');});$('tab-leads').hidden=t.dataset.tab!=='leads';$('tab-sources').hidden=t.dataset.tab!=='sources';});});
var saved=load('pc_key');if(saved){$('code').value=saved;login(saved);}
})();
</script>
</body>
</html>
